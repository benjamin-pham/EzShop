services:
  postgres:
    image: postgres:17-alpine
    container_name: ezshop-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Admin@123456
      POSTGRES_DB: ezshop
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ezshop-net

volumes:
  postgres-data:

networks:
  ezshop-net:
    name: ezshop-net
    driver: bridge
